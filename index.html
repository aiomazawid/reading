<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Reading</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--muted:#5b667a;--line:#e3e8f1;--brand:#2f5bea;--brand-ink:#fff;--ok:#0f8a5f;--okbg:#dcf5ea;--bad:#c0392b;--badbg:#fde4e1;--rec:#d92d20}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eaf0ff;--muted:#9fb0cf;--line:#2a3856;--brand:#6f93ff;--brand-ink:#0b1220;--ok:#5fd6a8;--okbg:#12382b;--bad:#ff8f84;--badbg:#401c19;--rec:#ff6b5e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5;padding:16px}
main{max-width:640px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
#passage{direction:ltr;text-align:left;font-size:22px;line-height:1.75;font-family:Georgia,"Times New Roman",serif}
#passage span.w{padding:0 1px;border-radius:4px}
#passage span.ok{background:var(--okbg)}
#passage span.bad{background:var(--badbg);text-decoration:underline wavy var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 22px;min-height:52px;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
#rec.recording{background:var(--rec);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-inline-end:8px;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
#timer{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.note{font-size:13.5px;color:var(--muted)}
.msg{margin-top:12px;font-weight:600}
.err{color:var(--bad)}
.score{font-size:54px;font-weight:800;line-height:1;direction:ltr;text-align:right}
.score small{font-size:20px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.grid b{display:block;font-size:20px}
.grid span{font-size:12.5px;color:var(--muted)}
.dbg{margin-top:14px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);direction:ltr;text-align:left;word-break:break-all}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1 id="ttl">اختبار القراءة</h1>
  <p class="sub">اقرأ النص بصوت واضح، ثم اضغط إيقاف.</p>

  <div class="card hidden" id="box">
    <div id="passage" lang="en" aria-label="Reading passage"></div>
    <div class="row">
      <button id="rec" type="button">ابدأ التسجيل</button>
      <span id="timer" aria-live="off"></span>
    </div>
    <p class="note" id="priv">عند الضغط على «ابدأ التسجيل» سيُحفظ تسجيل صوتك ليستمع إليه معلمك. اقرأ في مكان هادئ وقرّب الجوال منك.</p>
    <p class="msg" id="msg" role="status"></p>
    <p class="note" id="left"></p>
  </div>

  <div class="dbg hidden" id="dbg"></div>
</main>

<script>
(function(){
'use strict';
var EXEC='https://script.google.com/macros/s/AKfycbwD9WMpiq9t8boJEcrB5bjxxnRq3g1dEF4zrx1pDoI6YrOzUft9Em66qzgCzq_iIYz8/exec';
var MAX_MS=120000;
function $(i){return document.getElementById(i)}
var q=new URLSearchParams(location.search), token=q.get('t')||'';
try{ history.replaceState(null,'',location.pathname); }catch(e){}

var text='', words=[], left=0;
var stream=null, recorder=null, chunks=[], t0=0, timerId=0, stopTimer=0;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, srec=null, wantSR=false, finalText='', interim='', srErr='', srEnded=null;
var state='idle';

function rdWords(s){return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/'/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);}
function say(m,bad){var e=$('msg'); e.textContent=m||''; e.className='msg'+(bad?' err':'');}
/* سطر التشخيص مخفي عن الطلاب: يظهر للمعلم بالضغط 5 مرات على العنوان */
var dbgShow=false, taps=0;
function dbg(m){var d=$('dbg'); d.textContent=m; if(dbgShow) d.classList.remove('hidden');}
$('ttl').onclick=function(){ if(++taps>=5){ dbgShow=true; if($('dbg').textContent) $('dbg').classList.remove('hidden'); } };
function fmt(ms){var s=Math.floor(ms/1000);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);}

function drawPassage(marks){
  var box=$('passage'); box.innerHTML=''; var pos=0;
  words.forEach(function(w,i){
    var sp=document.createElement('span'); sp.className='w'; sp.textContent=w.tok;
    if(marks){ var all=1, k=w.k; for(var j=0;j<k;j++){ if(!marks[pos+j]) all=0; } pos+=k; if(k) sp.className+=all?' ok':' bad'; }
    box.appendChild(sp); if(i<words.length-1) box.appendChild(document.createTextNode(' '));
  });
}

function setLeft(n){
  left=n; $('left').textContent='المحاولات المتبقية: '+n;
  $('rec').disabled = n<=0 || state!=='idle';
  if(n<=0) say('انتهت محاولاتك لهذا النص.');
}

function load(){
  if(!/^[a-f0-9]{40}$/.test(token)){ $('ttl').textContent='الرابط غير صالح'; say('افتح هذه الصفحة من زر القراءة داخل البوابة.',true); $('box').classList.remove('hidden'); $('rec').classList.add('hidden'); $('priv').classList.add('hidden'); return; }
  fetch(EXEC+'?act=rtask&t='+encodeURIComponent(token)).then(function(r){return r.json();}).then(function(r){
    if(!r||!r.ok){ $('ttl').textContent='انتهت صلاحية الرابط'; $('box').classList.remove('hidden'); $('rec').classList.add('hidden'); $('priv').classList.add('hidden'); say('ارجع إلى البوابة واضغط زر القراءة من جديد.',true); return; }
    text=r.text; $('ttl').textContent=r.title||'Reading';
    words=text.split(/\s+/).filter(Boolean).map(function(t){return {tok:t,k:rdWords(t).length};});
    drawPassage(null); $('box').classList.remove('hidden'); setLeft(r.left);
  }).catch(function(){ $('ttl').textContent='تعذّر الاتصال'; $('box').classList.remove('hidden'); $('rec').classList.add('hidden'); say('تحقق من الإنترنت ثم أعد فتح الصفحة من البوابة.',true); });
}

/* ---------- التسجيل ---------- */
function startSR(){
  if(!SR) return;
  try{
    srec=new SR(); srec.lang='en-US'; srec.continuous=true; srec.interimResults=true; srec.maxAlternatives=1;
    srec.onresult=function(e){ interim=''; for(var i=e.resultIndex;i<e.results.length;i++){ var r=e.results[i]; if(r.isFinal){ finalText+=r[0].transcript+' '; } else { interim+=r[0].transcript+' '; } } };
    srec.onerror=function(e){ srErr=e&&e.error||'error'; };
    srec.onend=function(){ if(wantSR){ try{ srec.start(); }catch(_){} } else if(srEnded){ srEnded(); } };
    srec.start();
  }catch(e){ srErr='start-failed'; }
}
function stopSR(cb){
  wantSR=false; var done=false; function fin(){ if(done) return; done=true; srEnded=null; cb(); }
  if(!srec){ fin(); return; }
  srEnded=fin; try{ srec.stop(); }catch(_){ fin(); } setTimeout(fin,1500);
}

function begin(){
  say(''); drawPassage(null);
  if(!navigator.mediaDevices||!window.MediaRecorder){ say('متصفحك لا يدعم التسجيل. جرّب Chrome.',true); return; }
  state='starting'; $('rec').disabled=true;
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(s){
    stream=s; chunks=[]; finalText=''; interim=''; srErr='';
    var opts={}; try{ opts.audioBitsPerSecond=32000; }catch(_){}
    try{ recorder=new MediaRecorder(stream,opts); }catch(e){ recorder=new MediaRecorder(stream); }
    recorder.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    recorder.start(1000); t0=Date.now(); wantSR=true; startSR();
    state='recording'; var b=$('rec'); b.disabled=false; b.classList.add('recording'); b.innerHTML='<span class="dot"></span>إيقاف وإرسال';
    timerId=setInterval(function(){ $('timer').textContent=fmt(Date.now()-t0); },250);
    stopTimer=setTimeout(function(){ if(state==='recording') finish(); },MAX_MS);
  }).catch(function(e){
    state='idle'; $('rec').disabled=false;
    var n=e&&e.name||'';
    say(n==='NotAllowedError'||n==='SecurityError' ? 'لم يُسمح باستخدام الميكروفون. اضغط على القفل بجانب عنوان الصفحة واسمح بالميكروفون ثم أعد المحاولة.' : 'تعذّر تشغيل الميكروفون ('+n+').',true);
  });
}

function finish(){
  if(state!=='recording') return; state='sending';
  clearInterval(timerId); clearTimeout(stopTimer);
  var ms=Date.now()-t0, b=$('rec'); b.disabled=true; b.classList.remove('recording'); b.textContent='جارٍ الإرسال...'; say('جارٍ إرسال تسجيلك وتقييمه، لا تغلق الصفحة...');
  var mime=(recorder&&recorder.mimeType)||'audio/webm';
  recorder.onstop=function(){
    try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(_){}
    stopSR(function(){
      var transcript=(finalText+' '+interim).replace(/\s+/g,' ').trim();
      var blob=new Blob(chunks,{type:mime});
      if(blob.size<1500){ reset('التسجيل قصير جداً أو فارغ. أعد المحاولة وتأكد أن الميكروفون يعمل.',true,ms,transcript,blob.size); return; }
      var fr=new FileReader();
      fr.onload=function(){
        var b64=String(fr.result).split(',')[1]||'';
        fetch(EXEC,{method:'POST',body:JSON.stringify({t:token,audio:b64,mime:mime,transcript:transcript,ms:ms})})
          .then(function(r){return r.json();}).then(function(r){ done(r,transcript,ms,blob.size); })
          .catch(function(){ reset('تعذّر الإرسال. تحقق من الإنترنت وأعد المحاولة.',true,ms,transcript,blob.size); });
      };
      fr.readAsDataURL(blob);
    });
  };
  try{ recorder.stop(); }catch(_){ recorder.onstop(); }
}

function reset(m,bad,ms,tr,bytes){
  state='idle'; var b=$('rec'); b.classList.remove('recording'); b.textContent='ابدأ التسجيل'; $('timer').textContent=''; say(m,bad); setLeft(left);
  dbg('ms='+ms+' bytes='+bytes+' sr='+(SR?'yes':'no')+' srErr='+srErr+' words='+(tr?tr.split(' ').length:0));
}

function done(r,transcript,ms,bytes){
  if(!r||!r.ok){
    var m={expired:'انتهت صلاحية الرابط. ارجع إلى البوابة وافتح الصفحة من جديد.',limit:'انتهت محاولاتك.',audio:'حجم التسجيل غير مقبول.',busy:'الخادم مشغول، أعد المحاولة بعد لحظات.'}[r&&r.msg]||'حدث خطأ. أعد المحاولة.';
    reset(m,true,ms,transcript,bytes); return;
  }
  state='idle'; var b=$('rec'); b.classList.remove('recording'); b.textContent='تسجيل جديد'; $('timer').textContent='';
  setLeft(r.left);
  if(!transcript){
    say('تم حفظ تسجيلك. سيستمع إليه معلمك وتصلك النتيجة لاحقاً.');
    dbg('ms='+ms+' bytes='+bytes+' sr='+(SR?'yes':'no')+' srErr='+srErr+' words=0');
    return;
  }
  say('تم حفظ تسجيلك. سيستمع إليه معلمك وتصلك النتيجة لاحقاً.');
  dbg('ms='+ms+' bytes='+bytes+' sr='+(SR?'yes':'no')+' srErr='+srErr+' words='+transcript.split(' ').length);
}

$('rec').onclick=function(){ if(state==='idle') begin(); else if(state==='recording') finish(); };
window.addEventListener('pagehide',function(){ try{ if(stream) stream.getTracks().forEach(function(t){t.stop();}); }catch(_){} });
load();
})();
</script>
</body>
</html>
